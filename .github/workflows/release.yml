name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test winbox.slnx -c Release

      # The same script contributors run locally, so the published zip and hash match a local build.
      - name: Publish, zip and hash
        shell: pwsh
        run: ./scripts/package.ps1

      # Assets are uploaded under their file names, which install.ps1 and the README download by name.
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/winbox-win-x64.zip
            dist/winbox-win-x64.zip.sha256
            scripts/install.ps1
