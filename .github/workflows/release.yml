name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test winbox.slnx -c Release

      - name: Publish
        run: >-
          dotnet publish src/Winbox.Cli -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -o out

      - name: Zip and hash
        shell: pwsh
        run: |
          $zip = 'winbox-win-x64.zip'
          Compress-Archive -Path out\* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  $zip" -Encoding ascii -NoNewline

      - name: Stage installer
        shell: pwsh
        run: Copy-Item scripts/install.ps1 install.ps1

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            winbox-win-x64.zip
            winbox-win-x64.zip.sha256
            install.ps1
