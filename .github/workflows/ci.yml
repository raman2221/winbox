name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore winbox.slnx

      - name: Build
        run: dotnet build winbox.slnx -c Release --no-restore

      - name: Test
        run: dotnet test winbox.slnx -c Release --no-build
